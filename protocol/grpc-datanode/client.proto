syntax = "proto3";

package tidets.datanode.v1;

option go_package = "github.com/hanami/tidets/protocol/grpc-datanode/pb;pb";

// 客户端 API：消息 + RPC 同文件，避免 IDE 无法解析跨文件 import。

// ---------- 数据类型 ----------

enum TSDataType {
  TS_DATA_TYPE_UNSPECIFIED = 0;
  TS_DATA_TYPE_BOOLEAN = 1;
  TS_DATA_TYPE_INT32 = 2;
  TS_DATA_TYPE_INT64 = 3;
  TS_DATA_TYPE_FLOAT = 4;
  TS_DATA_TYPE_DOUBLE = 5;
  TS_DATA_TYPE_TEXT = 6;
}

message TSValue {
  TSDataType data_type = 1;
  oneof value {
    bool bool_value = 2;
    int32 int32_value = 3;
    int64 int64_value = 4;
    float float_value = 5;
    double double_value = 6;
    string text_value = 7;
  }
}

// ---------- 会话 ----------

message OpenSessionRequest {
  string username = 1;
  string password = 2;
  string version = 3;
  bool enable_rpc_compression = 4;
  int64 fetch_size = 5;
}

message OpenSessionResponse {
  int64 session_id = 1;
}

message CloseSessionRequest {
  int64 session_id = 1;
}

message CloseSessionResponse {}

// ---------- 写入 ----------

message InsertPointRequest {
  int64 session_id = 1;
  string device_path = 2;
  string measurement = 3;
  int64 timestamp = 4;
  TSValue value = 5;
}

message InsertPointResponse {}

message BatchPoint {
  string measurement = 1;
  int64 timestamp = 2;
  TSValue value = 3;
}

message InsertBatchRequest {
  int64 session_id = 1;
  string device_path = 2;
  repeated BatchPoint points = 3;
}

message InsertBatchResponse {
  int32 inserted = 1;
}

// ---------- 查询 ----------

message QueryRangeRequest {
  int64 session_id = 1;
  string device_path = 2;
  string measurement = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  int32 limit = 6; // 0 表示使用会话 fetch_size
}

message PointData {
  int64 timestamp = 1;
  TSValue value = 2;
}

message QueryRangeResponse {
  repeated PointData points = 1;
}

// ---------- SQL（最简 INSERT / SELECT）----------

message ExecuteSQLRequest {
  int64 session_id = 1;
  string sql = 2;
}

message SQLRow {
  int64 timestamp = 1;
  TSValue value = 2;
}

message ExecuteSQLResponse {
  int32 affected_rows = 1; // INSERT 时为 1
  repeated SQLRow rows = 2; // SELECT 结果
}

// ---------- 服务 ----------

service DataNodeSessionService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc InsertPoint(InsertPointRequest) returns (InsertPointResponse);
  rpc InsertBatch(InsertBatchRequest) returns (InsertBatchResponse);
  rpc QueryRange(QueryRangeRequest) returns (QueryRangeResponse);
  rpc ExecuteSQL(ExecuteSQLRequest) returns (ExecuteSQLResponse);
}
